<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odyssey UI — React components</title>
    <meta
      name="description"
      content="Odyssey UI component library documentation: live previews, import instructions, and copyable code for every component."
    />
    <!--
      Explicit favicon so the browser doesn't fall back to an unbased
      GET /favicon.ico at the domain root (404s on a GitHub Pages project
      site, which only serves under /odyssey-ui/).
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111827'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23fff'%3EO%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply the persisted docs theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("odyssey-docs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* default light */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Sora:wght@800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
