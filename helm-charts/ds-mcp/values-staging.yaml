appName: stag-ds-mcp

# image.repository and image.tag are set by the deploy workflow
# (--set image.repository/--set image.tag); values here are fallbacks.
image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent

replicaCount: 2

containerPorts:
    http: 3002

resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        memory: 256Mi

topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

service:
    sslCertificateName: ""

env:
    PORT: "3002"

secrets: {}
