name: CI

on:
    pull_request:
    push:
        branches: [master, v2]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.24.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # packages/registry's src/index.ts statically imports
            # dist/registry.json (see that file's top comment), and
            # packages/ds-mcp imports @your-job-search-genius/ds-registry
            # as a workspace package that resolves to compiled ./lib
            # output (see registry's package.json main/types/exports) --
            # both dist/registry.json and lib/ must exist before
            # tsc/vitest touch either package, so run registry's full
            # build (tsx src/build.ts && tsc) up front rather than
            # relying on gitignored local state a fresh CI checkout
            # won't have.
            - name: Build registry
              run: pnpm --filter @your-job-search-genius/ds-registry run build

            - name: Type-check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint:check

            - name: Prettier
              run: pnpm run prettier:check

            - name: Unit tests
              run: pnpm run test:unit

            - name: Registry drift check
              run: pnpm run registry:check-drift
