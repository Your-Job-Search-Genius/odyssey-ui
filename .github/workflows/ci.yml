name: CI

on:
    pull_request:
    push:
        branches: [master, v2]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.24.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # packages/registry's src/index.ts statically imports
            # dist/registry.json (see that file's top comment), and the
            # workspace packages resolve each other through their
            # compiled ./lib output (see each package.json's
            # main/types/exports): ds-mcp imports ds-registry, and
            # eslint-plugin-ds imports both ds-mcp and ds-registry --
            # so dist/registry.json plus both packages' lib/ must exist
            # before tsc/vitest touch any dependent package. Build them
            # in dependency order up front rather than relying on
            # gitignored local state a fresh CI checkout won't have.
            - name: Build registry
              run: pnpm --filter @your-job-search-genius/ds-registry run build

            - name: Build ds-mcp
              run: pnpm --filter @your-job-search-genius/ds-mcp run build

            # apps/docs also imports @your-job-search-genius/ui-tree
            # through its compiled ./lib output, plus two gitignored
            # generated files (lib/playground-registry.ts and
            # lib/playground/component-map.generated.ts) written by the
            # docs sync script -- both must exist before type-check.
            - name: Build ui-tree
              run: pnpm --filter @your-job-search-genius/ui-tree run build

            - name: Generate docs content (props tables, demo/playground registries)
              run: pnpm --filter @your-job-search-genius/docs run sync

            - name: Type-check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint:check

            - name: Prettier
              run: pnpm run prettier:check

            - name: Unit tests
              run: pnpm run test:unit

            - name: Registry drift check
              run: pnpm run registry:check-drift
